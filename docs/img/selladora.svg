<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <title>Render de la Selladora Flow Line</title>
  <defs>
    <linearGradient id="fondo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#16202c"/><stop offset="1" stop-color="#0d131b"/>
    </linearGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c9d2dd"/><stop offset="1" stop-color="#7d8896"/>
    </linearGradient>
    <linearGradient id="banda" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a4250"/><stop offset="1" stop-color="#1e242d"/>
    </linearGradient>
    <linearGradient id="verde" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3fbf63"/><stop offset="1" stop-color="#21803c"/>
    </linearGradient>
    <linearGradient id="azul" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2f6fd6"/><stop offset="1" stop-color="#1d4fa3"/>
    </linearGradient>
    <linearGradient id="bolsa" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e9eef5"/><stop offset="1" stop-color="#b9c4d2"/>
    </linearGradient>
    <filter id="sombra" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#000" flood-opacity=".45"/>
    </filter>
    <marker id="flecha" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#ffb454"/>
    </marker>
  </defs>

  <rect width="960" height="520" fill="url(#fondo)"/>
  <text x="32" y="44" fill="#e6ebf2" font-size="24" font-weight="700">Selladora Flow Line</text>
  <text x="32" y="68" fill="#8f9bad" font-size="14">Dosificación · sellado térmico · transporte — ESP32 + FreeRTOS + web app sin internet</text>

  <!-- Piso -->
  <ellipse cx="470" cy="452" rx="420" ry="26" fill="#000" opacity=".35"/>

  <!-- Estructura (gabinete verde) -->
  <g filter="url(#sombra)">
    <rect x="90" y="300" width="760" height="130" rx="10" fill="url(#verde)"/>
    <rect x="90" y="300" width="760" height="14" rx="6" fill="#58d27b" opacity=".6"/>
    <rect x="110" y="330" width="220" height="80" rx="6" fill="#1d6e34" opacity=".55"/>
    <rect x="610" y="330" width="220" height="80" rx="6" fill="#1d6e34" opacity=".55"/>
  </g>

  <!-- Banda transportadora -->
  <g filter="url(#sombra)">
    <rect x="80" y="262" width="780" height="34" rx="17" fill="url(#banda)"/>
    <circle cx="97" cy="279" r="15" fill="url(#metal)"/><circle cx="843" cy="279" r="15" fill="url(#metal)"/>
    <g stroke="#556070" stroke-width="2">
      <line x1="140" y1="266" x2="140" y2="292"/><line x1="200" y1="266" x2="200" y2="292"/><line x1="260" y1="266" x2="260" y2="292"/>
      <line x1="320" y1="266" x2="320" y2="292"/><line x1="380" y1="266" x2="380" y2="292"/><line x1="440" y1="266" x2="440" y2="292"/>
      <line x1="500" y1="266" x2="500" y2="292"/><line x1="560" y1="266" x2="560" y2="292"/><line x1="620" y1="266" x2="620" y2="292"/>
      <line x1="680" y1="266" x2="680" y2="292"/><line x1="740" y1="266" x2="740" y2="292"/><line x1="800" y1="266" x2="800" y2="292"/>
    </g>
  </g>
  <line x1="330" y1="248" x2="560" y2="248" stroke="#ffb454" stroke-width="3" stroke-dasharray="6 6" marker-end="url(#flecha)"/>

  <!-- Bolsas -->
  <g filter="url(#sombra)">
    <path d="M180 262 L184 196 Q200 186 216 196 L220 262 Z" fill="url(#bolsa)"/>
    <path d="M186 214 L214 214 L218 262 L182 262 Z" fill="#6fb7ff" opacity=".55"/>
    <path d="M440 262 L444 200 L476 200 L480 262 Z" fill="url(#bolsa)"/>
    <path d="M446 224 L474 224 L478 262 L442 262 Z" fill="#6fb7ff" opacity=".55"/>
    <path d="M740 262 L744 206 L776 206 L780 262 Z" fill="url(#bolsa)"/>
    <path d="M746 226 L774 226 L778 262 L742 262 Z" fill="#6fb7ff" opacity=".55"/>
    <rect x="743" y="204" width="34" height="5" fill="#ffb454"/>
  </g>

  <!-- Estación 1: bomba y boquilla -->
  <g filter="url(#sombra)">
    <rect x="150" y="96" width="100" height="44" rx="8" fill="#2a3240"/>
    <circle cx="178" cy="118" r="12" fill="#11161d" stroke="#6fb7ff" stroke-width="3"/>
    <rect x="194" y="140" width="12" height="36" fill="url(#metal)"/>
    <path d="M192 176 L208 176 L202 188 L198 188 Z" fill="#9aa6b5"/>
  </g>
  <path d="M200 192 Q199 200 200 206" stroke="#6fb7ff" stroke-width="3" fill="none"/>
  <!-- Sensor de bolsa (S1) -->
  <rect x="112" y="226" width="34" height="12" rx="6" fill="#f2c230"/>
  <path d="M146 232 L178 232" stroke="#ff5a52" stroke-width="2" stroke-dasharray="3 3"/>

  <!-- Estación 2: selladora con pistones -->
  <g filter="url(#sombra)">
    <rect x="390" y="88" width="140" height="22" rx="4" fill="url(#metal)"/>
    <rect x="404" y="110" width="10" height="56" fill="#c9d2dd"/><rect x="506" y="110" width="10" height="56" fill="#c9d2dd"/>
    <rect x="398" y="92" width="22" height="40" rx="3" fill="#8a96a8"/><rect x="500" y="92" width="22" height="40" rx="3" fill="#8a96a8"/>
    <rect x="404" y="166" width="112" height="26" rx="6" fill="url(#azul)"/>
    <rect x="412" y="188" width="96" height="6" fill="#ff7a45"/>
    <circle cx="498" cy="179" r="5" fill="#ff5a52"/>
  </g>
  <!-- Compresor -->
  <g filter="url(#sombra)">
    <rect x="620" y="110" width="110" height="64" rx="12" fill="#2a3240"/>
    <circle cx="652" cy="142" r="20" fill="#11161d" stroke="#8a96a8" stroke-width="3"/>
    <path d="M652 142 L664 132" stroke="#3fbf63" stroke-width="3"/>
    <rect x="684" y="126" width="34" height="8" rx="3" fill="#8a96a8"/><rect x="684" y="142" width="34" height="8" rx="3" fill="#8a96a8"/>
  </g>
  <path d="M620 130 C580 130 560 100 532 100" stroke="#8fa3bb" stroke-width="4" fill="none"/>

  <!-- Sensor fin de banda (S2) -->
  <rect x="808" y="226" width="34" height="12" rx="6" fill="#f2c230"/>
  <path d="M808 232 L782 232" stroke="#ff5a52" stroke-width="2" stroke-dasharray="3 3"/>

  <!-- ESP32 + relés -->
  <g filter="url(#sombra)">
    <rect x="300" y="336" width="120" height="66" rx="6" fill="#111820"/>
    <rect x="316" y="348" width="54" height="40" rx="3" fill="#b9c4d2"/>
    <circle cx="398" cy="356" r="4" fill="#ff3b30"/>
    <rect x="440" y="336" width="160" height="66" rx="6" fill="#1d4fa3"/>
    <rect x="452" y="346" width="30" height="46" rx="3" fill="#2f6fd6"/><rect x="488" y="346" width="30" height="46" rx="3" fill="#2f6fd6"/>
    <rect x="524" y="346" width="30" height="46" rx="3" fill="#2f6fd6"/><rect x="560" y="346" width="30" height="46" rx="3" fill="#2f6fd6"/>
  </g>

  <!-- Etiquetas -->
  <g font-size="13" fill="#e6ebf2">
    <text x="108" y="236" text-anchor="end">S1 Bolsa · RX2</text>
    <text x="146" y="88">Bomba · D2</text>
    <text x="268" y="146">Pistones D4 · D5</text>
    <text x="268" y="164">Calentador D23</text>
    <text x="614" y="100">Compresor · D26</text>
    <text x="848" y="236">S2 Fin · D18</text>
    <text x="580" y="240">Banda · D15</text>
    <text x="300" y="420">ESP32</text>
    <text x="440" y="420">Módulo de relés</text>
  </g>
  <g font-size="12" fill="#8f9bad">
    <text x="640" y="460">Wi-Fi AP “FlowLine-Selladora” · http://192.168.4.1</text>
  </g>
  <g font-size="13" font-weight="700" fill="#ffb454">
    <text x="170" y="500">① Dosificar</text><text x="420" y="500">② Sellar</text><text x="720" y="500">③ Evacuar</text>
  </g>
</svg>
