<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 600" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <title>Render del brazo robótico 5 DOF</title>
  <defs>
    <linearGradient id="fondo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#16202c"/><stop offset="1" stop-color="#0d131b"/>
    </linearGradient>
    <linearGradient id="blanco" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#c9d2dd"/>
    </linearGradient>
    <linearGradient id="negro" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a4250"/><stop offset="1" stop-color="#14181f"/>
    </linearGradient>
    <linearGradient id="azul" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3b82f6"/><stop offset="1" stop-color="#1d4fa3"/>
    </linearGradient>
    <filter id="sombra" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#000" flood-opacity=".5"/>
    </filter>
  </defs>

  <rect width="760" height="600" fill="url(#fondo)"/>
  <text x="32" y="44" fill="#e6ebf2" font-size="24" font-weight="700">Brazo robótico 5 DOF</text>
  <text x="32" y="68" fill="#8f9bad" font-size="14">ESP32 · 5 servos · web con sliders y vista 3D · movimiento suave a 90°/s</text>

  <g transform="translate(20 120) scale(.82)">
  <ellipse cx="300" cy="500" rx="190" ry="22" fill="#000" opacity=".4"/>

  <!-- Base (J1) -->
  <g filter="url(#sombra)">
    <path d="M150 470 L450 470 L430 500 L170 500 Z" fill="#11161d"/>
    <rect x="190" y="400" width="220" height="72" rx="14" fill="url(#negro)"/>
    <ellipse cx="300" cy="400" rx="110" ry="18" fill="#4a5363"/>
    <path d="M250 400 L250 330 Q300 300 350 330 L350 400 Z" fill="url(#negro)"/>
    <rect x="270" y="350" width="60" height="40" rx="4" fill="#0b0e13"/>
  </g>

  <!-- Hombro (J2) y brazo superior -->
  <g filter="url(#sombra)">
    <g transform="rotate(-22 300 340)">
      <rect x="276" y="160" width="48" height="190" rx="22" fill="url(#blanco)"/>
      <rect x="282" y="250" width="36" height="60" rx="4" fill="#11161d"/>
      <circle cx="300" cy="340" r="26" fill="#e9eef3"/>
      <circle cx="300" cy="340" r="9" fill="#8a96a8"/>
      <!-- Codo (J3) y antebrazo -->
      <g transform="rotate(58 300 172)">
        <circle cx="300" cy="172" r="24" fill="#e9eef3"/>
        <rect x="282" y="20" width="36" height="160" rx="16" fill="url(#blanco)"/>
        <circle cx="300" cy="172" r="8" fill="#8a96a8"/>
        <!-- Muñeca (J4) -->
        <g transform="rotate(-40 300 32)">
          <rect x="284" y="-6" width="32" height="40" rx="5" fill="url(#azul)"/>
          <!-- Pinza (J5) -->
          <rect x="278" y="-24" width="44" height="20" rx="4" fill="#11161d"/>
          <rect x="278" y="-62" width="9" height="40" rx="3" fill="#ff8a3d"/>
          <rect x="313" y="-62" width="9" height="40" rx="3" fill="#ff8a3d"/>
        </g>
      </g>
    </g>
  </g>

  </g>

  <!-- Leyenda de articulaciones -->
  <rect x="470" y="150" width="256" height="196" rx="10" fill="#0b1017" stroke="#2a3442"/>
  <text x="488" y="178" fill="#8f9bad" font-size="12" font-weight="700" letter-spacing="1">ARTICULACIONES</text>
  <g font-size="14" fill="#e6ebf2">
    <circle cx="496" cy="204" r="6" fill="#3a4250" stroke="#8a96a8"/><text x="512" y="209">J1 Base · GPIO 23</text>
    <circle cx="496" cy="234" r="6" fill="#e9eef3"/><text x="512" y="239">J2 Hombro · GPIO 22</text>
    <circle cx="496" cy="264" r="6" fill="#e9eef3"/><text x="512" y="269">J3 Codo · GPIO 19</text>
    <circle cx="496" cy="294" r="6" fill="#3b82f6"/><text x="512" y="299">J4 Muñeca · GPIO 18</text>
    <circle cx="496" cy="324" r="6" fill="#ff8a3d"/><text x="512" y="329">J5 Pinza · GPIO 15</text>
  </g>
  <g font-size="12" fill="#8f9bad">
    <text x="470" y="390">Wi-Fi AP “Robot-Pinza” · http://192.168.4.1</text>
    <text x="470" y="410">Sin señal PWM hasta la primera orden</text>
  </g>
</svg>
